{{ define "main" }}

<section class="index topmost-section">
  <div class="container">
    <div class="row">
<div class="col-md-12">
        {{ if .Params.banner }}
        <img
          class="blog-list-image"
          src="{{ .Params.banner }}"
          alt="{{ .Title }}"
        />
        {{ end }}
      </div>
      <div class="col-md-12 center-container">
        <div class="content-container">
          {{ .Content }}
        </div>
      </div>
    </div>
  </div>
</section>

{{ end }}
